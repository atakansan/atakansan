<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Atakan San: automation that keeps itself honest">
<title>Atakan San: automation that keeps itself honest</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070d18"/><stop offset="1" stop-color="#121f33"/></linearGradient>
<radialGradient id="halo" cx="1040" cy="170" r="190" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e0b453" stop-opacity=".22"/><stop offset="1" stop-color="#e0b453" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#9aa3b5" opacity=".18"/></pattern>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="1280" height="340" rx="22"/></clipPath>
</defs>
<style>
.ring { fill: none; stroke: #e0b453; stroke-width: 2.4; stroke-linecap: round; opacity: .32; transform-box: fill-box; transform-origin: center; }
.r0 { animation: spin 60s linear infinite; } .r1 { animation: spin 45s linear infinite reverse; }
.r2 { animation: spin 34s linear infinite; } .r3 { animation: spin 24s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.thread { fill: none; stroke: #e0b453; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 4.2s cubic-bezier(.6,.05,.3,1) both; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.core { fill: #e0b453; transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out 4.2s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.8); opacity: .55; } }
.fade { animation: rise 1.1s ease-out both; } .d1 { animation-delay: .25s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .75s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.name { font: 600 74px 'Iowan Old Style', Palatino, Georgia, serif; fill: #ece6d9; letter-spacing: -.5px; }
.tag { font: italic 400 28px 'Iowan Old Style', Palatino, Georgia, serif; fill: #e0b453; }
.meta { font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #9aa3b5; letter-spacing: 2.4px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#card)">
<rect width="1280" height="340" fill="url(#bg)"/>
<rect width="1280" height="340" fill="url(#dots)"/>
<circle cx="1040" cy="170" r="190" fill="url(#halo)"/>
<circle class="ring r0" cx="1040" cy="170" r="132" stroke-dasharray="560 270"/>
<circle class="ring r1" cx="1040" cy="170" r="100" stroke-dasharray="380 248"/>
<circle class="ring r2" cx="1040" cy="170" r="68" stroke-dasharray="250 177"/>
<circle class="ring r3" cx="1040" cy="170" r="36" stroke-dasharray="140 86"/>
<path class="thread" filter="url(#glow)" pathLength="1" d="M -10 318 C 300 318, 640 330, 800 280 C 880 262, 908 230, 908 170 A 116 116 0 0 1 1140 170 A 84 84 0 0 1 972 170 A 52 52 0 0 1 1076 170 A 18 18 0 0 1 1040 170"/>
<circle class="core" cx="1040" cy="170" r="7"/>
</g>
<rect x=".5" y=".5" width="1279" height="339" rx="22" fill="none" stroke="#24324a"/>
<text class="meta fade" x="72" y="96">LOCAL-FIRST · SELF-HEALING · SECURITY-FIRST</text>
<text class="name fade d1" x="68" y="178">Atakan San</text>
<text class="tag fade d2" x="72" y="228">Automation that keeps itself honest.</text>
<text class="meta fade d3" x="72" y="276">Find the root cause. Make it never come back.</text>
</svg>
