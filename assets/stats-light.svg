<svg xmlns="http://www.w3.org/2000/svg" width="1224" height="160" viewBox="0 0 1224 160" role="img" aria-label="4,000+ contributions">
<title>4,000+ contributions</title>
<style>
.big { font: 600 52px 'Iowan Old Style', Palatino, Georgia, serif; fill: #1c2230; }
.small { font: 400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #5b6170; }
.tile { animation: rise .9s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g class="tile" style="animation-delay:0.00s">
<rect x="0.5" y=".5" width="1223" height="159" rx="18" fill="#fffaf1" stroke="#d9cfbd"/>
<rect x="594" y="30" width="36" height="3" rx="1.5" fill="#a87a1c"/>
<text class="big" x="612" y="98" text-anchor="middle">4,000+</text>
<text class="small" x="612" y="130" text-anchor="middle" letter-spacing="3">CONTRIBUTIONS</text>
</g>
</svg>
